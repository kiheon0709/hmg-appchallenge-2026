<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>TABI scene3d</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
#help,#fps{position:fixed;top:12px;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#cfd6dd;background:rgba(8,10,14,.74);padding:10px 12px;border-radius:6px;white-space:pre;pointer-events:none}
#help{left:12px}#fps{right:12px}
.hidden{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="help"></div>
<div id="fps" class="hidden"></div>
<script type="module">
import * as THREE from './three.module.min.js';

// ---------------------------------------------------------------- utilities
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (cur, tgt, rate, dt) => cur + (tgt - cur) * (1 - Math.exp(-rate * dt));
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const Q = new URLSearchParams(location.search);

// ---------------------------------------------------------------- parameters and state
const DEFAULTS = { speed: 100, brake: 0, steer: 0, turn: 'off', rain: 0, wiper: 0, defrost: false, ac: false, freshAir: false,
  fog: 0, headlights: 1, tunnel: false, leadBrake: false, gap: 32, leadSpeed: null, lead: true, hydroplane: 0, curve: 1, paused: false,
  // 앱(호스트)이 주는 값: 판정은 core가 하고 장면은 따라가기만 한다. null이면 장면이 스스로 계산한다
  hostSpeed: null, hostGap: null, crash: false, lane: 0, landmark: null, hold: true, blur: 0, tunnelDist: 180,
  // ringT: 회전교차로에서 도는 차가 내 진입 지점을 지나가기까지 남은 시간(초, 지나가면 음수). null이면 장면이 알아서 돌린다
  ringT: null,
  fpsCap: +Q.get('fps_cap') || 0,
  // place: 장소(highway 고속도로, city 도심, school 어린이 보호구역, downhill 내리막). 문제 상황(비·안개·앞차 등)과 따로 고른다
  place: 'highway',
  daylight: 0,
  gateOpen: false }; // gateOpen: 일반 차로 요금소의 차단봉을 올린다 // daylight: 0 밤, 0.4 해 질 녘, 1 낮 // fpsCap: 초당 그릴 장수의 상한(0이면 화면 주사율 그대로)
const P = Object.assign({}, DEFAULTS, { quality: Q.get('q') === '0' ? 0 : 1, bloom: Q.get('q') !== '0' });
const S = {};
function resetState() {
  Object.assign(S, { time: 0, dist: 0, v: P.speed / 3.6, acc: 0, lv: P.speed / 3.6, gap: P.gap, x: 0, yaw: 0, pitch: 0, roll: 0, shake: 0,
    crashed: false, wasMoving: true, leadX: 0, leadLane: 0, leadInd: 0, leadBrakeVis: 0, leadStopped: false,
    low: 1, high: 0, fogGlass: 0, fogD: 0, rainS: 0, wPhase: 0, wRun: false, wA: 0, wB: 0, wAp: 0, wBp: 0,
    entW: null, exitW: null, inTunnel: false, glareZ: null, glareI: 0, opp: 0, far1: -190, far2: -280,
    hydro: false, hydroPh: 0, edge: 0, timers: [], rainOff: [0, 0, 0], wetReset: true, steerS: 0,
    laneX: 0, lmW: null, lmKind: null, lmZ: -5000, pedX: 5.6, placeId: 0, grade: 0, gradeS: 0, cutT: -1, cutFn: null, cutDone: false, rbA: 0, day: P.daylight, armA: 0 });
}
resetState();

// ---------------------------------------------------------------- renderer
const canvas = document.getElementById('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance' }); }
catch (e) { try { window.SideSeatBridge.onSimEvent('unsupported', JSON.stringify({ message: String(e) })); } catch (_) {} throw e; }
canvas.addEventListener('webglcontextlost', () => { try { window.SideSeatBridge.onSimEvent('unsupported', '{"message":"context lost"}'); } catch (_) {} });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.autoClear = true;
renderer.info.autoReset = false;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(44, 16 / 9, 0.2, 2500);
camera.rotation.order = 'YXZ';
scene.add(camera);
const EYE_X = -0.37, EYE_Y = 1.22, FRONT = 2.0; // driver's eye offset from car centre; eye to front bumper

// ---------------------------------------------------------------- procedural noise texture
function makeNoise() {
  const N = 256, d = new Uint8Array(N * N * 4), r = rng(11);
  const layer = (cells) => { const g = new Float32Array(cells * cells); for (let i = 0; i < g.length; i++) g[i] = r(); return (x, y) => { const fx = x / N * cells, fy = y / N * cells; const x0 = Math.floor(fx), y0 = Math.floor(fy); let tx = fx - x0, ty = fy - y0; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty); const a = g[(y0 % cells) * cells + x0 % cells], b = g[(y0 % cells) * cells + (x0 + 1) % cells], c = g[((y0 + 1) % cells) * cells + x0 % cells], e = g[((y0 + 1) % cells) * cells + (x0 + 1) % cells]; return lerp(lerp(a, b, tx), lerp(c, e, tx), ty); }; };
  const f1 = layer(64), f2 = layer(128), f3 = layer(32), b1 = layer(6), b2 = layer(12), b3 = layer(24);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const i = (y * N + x) * 4;
    d[i] = r() * 255; d[i + 1] = (f1(x, y) * 0.45 + f2(x, y) * 0.3 + f3(x, y) * 0.25) * 255; d[i + 2] = (b1(x, y) * 0.5 + b2(x, y) * 0.3 + b3(x, y) * 0.2) * 255; d[i + 3] = r() * 255; }
  const t = new THREE.DataTexture(d, N, N, THREE.RGBAFormat); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true; t.needsUpdate = true; return t;
}
const tNoise = makeNoise();
function makePlate() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 56; const g = c.getContext('2d');
  g.fillStyle = '#e9e9e4'; g.fillRect(0, 0, 256, 56); g.strokeStyle = '#111'; g.lineWidth = 3; g.strokeRect(2.5, 2.5, 251, 51);
  g.fillStyle = '#101010'; g.font = 'bold 40px "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('157나 3046', 128, 30);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}

// ---------------------------------------------------------------- shared uniforms
const U = {
  uDist: { value: 0 }, uTime: { value: 0 }, uQ: { value: 1 }, uCurve: { value: new THREE.Vector2() }, uTun: { value: new THREE.Vector2(-1e5, -1e5 - 1) },
  uCar: { value: new THREE.Vector3() }, uLamp: { value: new THREE.Vector4(1, 0, 0, 0) }, uFog: { value: new THREE.Vector4(0.011, 0.014, 0.02, 0.0005) },
  uEnv: { value: new THREE.Vector4(0, 1, 1.0, 0) }, uLead: { value: new THREE.Vector4(0, -32, 1, 0) }, uLeadInd: { value: new THREE.Vector2() },
  uOnc: { value: new THREE.Vector4(0, 0, -1000, 0) }, uFogGlow: { value: new THREE.Vector2() }, tNoise: { value: tNoise },
  uMark: { value: new THREE.Vector3(-5000, 0, 0) }, uDay: { value: 0 }, tRoadText: { value: null }, uCarSh: { value: Array.from({ length: 8 }, () => new THREE.Vector3(0, 0, 0)) },
  uOpp: { value: 0 }, uOppOn: { value: 1 }, uProjPx: { value: 900 }, uRainOff: { value: new THREE.Vector3() }, uSpeed: { value: 0 },
};

const COMMON = /* glsl */`
uniform float uDist, uTime, uQ, uDay; // uDay: 0 밤, 0.4 해 질 녘, 1 낮
uniform vec2 uCurve, uTun, uLeadInd, uFogGlow;
uniform vec3 uCar, uMark;
uniform sampler2D tRoadText;
uniform vec3 uCarSh[8];   // 다른 차(주차된 차, 회전교차로를 도는 차)의 자리 x, z와 켜짐
uniform vec4 uLamp, uFog, uEnv, uLead, uOnc;
uniform sampler2D tNoise;
const float SL_S = 50., SL_H = 9.5, SL_X = 5.2;
const vec3 SL_COL = vec3(1., .80, .56) * 150.;
const vec3 HL_COL = vec3(1., .95, .86);
const vec3 TUN_COL = vec3(1., .86, .64);
const vec3 SUN = vec3(0.46, 0.60, -0.655);
// 도심 건물 필지: 폭 15m, 600m마다 되풀이(40필지). 높이·틈·색의 씨앗을 필지 번호로 읽는다. side: 오른쪽 1, 왼쪽 0
const float LOT_W = 15.;
vec4 lotSeed(float id, float side){ return textureLod(tNoise, (vec2(mod(id, 40.), 21. + side*9.) + .5)/256., 0.); }
float lotHeight(vec4 h){ return uMark.z > 1.5 ? 4. + 4.5*h.r : 6.5 + 8.*h.r; }
float lotGap(vec4 h){ return 0.05 + 0.09*step(0.55, h.b); }
float nightK(){ return 1. - smoothstep(0.3, 0.7, uDay); }                       // 가로등·창 불빛이 켜진 정도
float dayBoost(float k){ return 1. + k*smoothstep(0.3, 1., uDay); }            // 밤(전조등)에 맞춘 어두운 색을 낮에는 밝힌다
vec3 dayMix(vec3 night, vec3 dusk, vec3 day){ return uDay < 0.4 ? mix(night, dusk, uDay/0.4) : mix(dusk, day, (uDay - 0.4)/0.6); }
vec3 bend(vec3 p){ float z = min(p.z, 0.); p.x += uCurve.x*z*z; p.y += uCurve.y*z*z; return p; }
float inTun(float z){ return step(z, uTun.x) * step(uTun.y, z); }
float inTunS(float z){ return smoothstep(uTun.x + 1., uTun.x - 5., z) * smoothstep(uTun.y - 1., uTun.y + 5., z); }
float headBeam(vec3 P, out vec3 dir){
  vec3 L = P - vec3(uCar.x, 0.68, -1.9);
  float d2 = dot(L, L); dir = L * inversesqrt(d2);
  float sy = sin(uCar.y), cy = cos(uCar.y);
  float f = dir.x*sy - dir.z*cy;
  if (f < 0.05) return 0.;
  float ax = (dir.x*cy + dir.z*sy) / f, ay = dir.y / f;
  float cut = -0.010 + 0.03*smoothstep(0., 0.14, ax);
  float below = smoothstep(cut + 0.006, cut - 0.012, ay);
  float low = (below / (1. + ay*ay*800.) + 0.012) * exp(-ax*ax*4.5);
  float high = exp(-ax*ax*9. - ay*ay*500.) + 0.03*exp(-ax*ax*2.5 - ay*ay*8.);
  return (uLamp.x*low*17000. + uLamp.y*high*45000.) / (d2 + 6.);
}
vec3 tunE(vec3 P, vec3 N){
  float rip = 1. + 0.18*cos(6.2832*(P.z - uDist)/8.);
  float s = 0.;
  for (int i = 0; i < 2; i++) {
    vec2 d = vec2(0.4 + (float(i)*2. - 1.)*3.3 - P.x, 5.9 - P.y); float r = length(d);
    s += (max(dot(N.xy, d/r), 0.) + 0.3*abs(N.z)) / (r + 0.5);
  }
  return TUN_COL * (s*3.2*rip + 0.10);
}
vec3 envDiff(vec3 P, vec3 N){
  float tun = inTunS(P.z);
  vec3 e = vec3(0.020, 0.026, 0.040) * uEnv.y * (0.5 + 0.5*max(N.y, 0.)) * (1. - tun);
  if (uDay > 0.001) { // 낮·해 질 녘의 하늘빛과 햇빛(비가 오면 흐려진다)
    float overcast = 1. - 0.55*uEnv.x;
    vec3 amb = dayMix(vec3(0.), vec3(0.15, 0.115, 0.125), vec3(0.38, 0.46, 0.60));
    vec3 sun = dayMix(vec3(0.), vec3(0.30, 0.15, 0.06), vec3(1.85, 1.70, 1.45)) * overcast * overcast;
    e += (amb * (0.6 + 0.4*max(N.y, 0.)) * overcast + sun * max(dot(N, SUN), 0.)) * (1. - tun);
  }
  float nk = nightK();
  float k = floor((P.z - uDist)/SL_S);
  for (int i = 0; i < 2; i++) {
    vec3 lp = vec3(SL_X, SL_H, (k + float(i))*SL_S + uDist);
    vec3 L = lp - P; float d2 = dot(L, L); L *= inversesqrt(d2);
    e += SL_COL * nk * max(dot(N, L), 0.) * smoothstep(0.15, 0.7, L.y) / (d2 + 1.) * (1. - inTun(lp.z)) * (1. - tun);
  }
  { vec3 L = vec3(uLead.x, 0.88, uLead.y + 0.2) - P; float d2 = dot(L, L); L *= inversesqrt(d2);
    e += vec3(1., 0.06, 0.03) * (uLead.z*0.5 + uLead.w*10.) * max(dot(N, L), 0.) * smoothstep(0., 0.5, -L.z) / (d2 + 0.6); }
  if (uLamp.z + uLamp.w > 0.001) {
    for (int i = 0; i < 2; i++) {
      float sgn = float(i)*2. - 1.;
      vec3 L = vec3(uCar.x + sgn*0.95, 0.7, -2.0) - P; float d2 = dot(L, L); L *= inversesqrt(d2);
      e += vec3(1., 0.5, 0.06) * (i == 0 ? uLamp.z : uLamp.w) * 9. * max(dot(N, L), 0.) / (d2 + 1.);
    }
  }
  if (tun > 0.001) e += tunE(P, N) * tun;
  return e;
}
float bp(vec3 N, vec3 V, vec3 L, float g){ vec3 H = normalize(L + V); return pow(max(dot(N, H), 0.), g) * (g + 8.) * 0.04; }
vec3 streetSpec(vec3 P, vec3 N, vec3 V, float g){
  vec3 R = reflect(-V, N); if (R.y < 0.01) return vec3(0.);
  float zh = P.z + R.z * (SL_H - P.y) / R.y;
  float k = floor((zh - uDist)/SL_S + .5);
  vec3 s = vec3(0.);
  for (int i = -1; i <= 1; i++) {
    vec3 lp = vec3(SL_X, SL_H, (k + float(i))*SL_S + uDist);
    vec3 L = lp - P; float d2 = dot(L, L); float d = sqrt(d2); L /= d;
    s += bp(N, V, L, g) / (d2 + 1.) * (1. - inTun(lp.z)) * exp(-d*uFog.a) * smoothstep(-620., -450., lp.z);
  }
  return SL_COL * s * (1. - inTun(P.z)) * nightK();
}
vec3 tailSpec(vec3 P, vec3 N, vec3 V, float g){
  float s = 0.;
  for (int i = 0; i < 2; i++) {
    vec3 L = vec3(uLead.x + (float(i)*2. - 1.)*0.7, 0.88, uLead.y + 0.1) - P; float d2 = dot(L, L); L *= inversesqrt(d2);
    s += bp(N, V, L, g) / (d2 + 1.) * step(0., -L.z);
  }
  return vec3(1., 0.07, 0.03) * (uLead.z*6. + uLead.w*45.) * s;
}
vec3 oncSpec(vec3 P, vec3 N, vec3 V, float g){
  vec3 L = uOnc.xyz - P; float d2 = dot(L, L); L *= inversesqrt(d2);
  return HL_COL * uOnc.w * 900. * bp(N, V, L, g) / (d2 + 1.);
}
vec3 tunSpec(vec3 P, vec3 N, vec3 V){
  vec3 R = reflect(-V, N); if (R.y < 0.02) return vec3(0.);
  vec2 h = P.xz + R.xz * (5.9 - P.y) / R.y;
  float lamp = smoothstep(0.14, 0.09, abs(fract((h.y - uDist)/8.) - .5));
  float rows = exp(-pow((h.x - 3.7)/0.4, 2.)) + exp(-pow((h.x + 2.9)/0.4, 2.));
  return TUN_COL * rows * lamp * 5. * inTun(h.y);
}
vec3 fogCol(vec3 dir){
  float sy = sin(uCar.y), cy = cos(uCar.y);
  float f = max(dir.x*sy - dir.z*cy, 0.);
  float ax = dir.x*cy + dir.z*sy, ay = dir.y;
  float glow = uFogGlow.x*exp(-ax*ax*5. - (ay + 0.10)*(ay + 0.10)*30.)*f + uFogGlow.y*exp(-ax*ax*3. - ay*ay*10.)*f;
  return uFog.rgb + HL_COL*glow;
}
vec3 fogMix(vec3 c, vec3 P){
  vec3 v = P - cameraPosition; float d = length(v);
  return mix(c, fogCol(v/d), 1. - exp(-d*uFog.a));
}
vec3 tone(vec3 c){ c *= uEnv.z; c = (c*(2.51*c + 0.03)) / (c*(2.43*c + 0.59) + 0.14); return pow(clamp(c, 0., 1.), vec3(0.4545)); }
`;

const LIT_VERT = /* glsl */`
attribute vec4 aData;
varying vec3 vP, vN, vL; varying vec2 vUv; varying vec4 vA;
void main(){
  vec4 wp = modelMatrix * vec4(position, 1.);
  vP = wp.xyz; vN = mat3(modelMatrix) * normal; vUv = uv; vA = aData; vL = position;
  #ifdef BEND
  wp.xyz = bend(wp.xyz);
  #endif
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;
const PROP_VERT = /* glsl */`
attribute vec3 iPos, iScale; attribute vec4 iData;
varying vec3 vP, vN, vL; varying vec2 vUv; varying vec4 vA;
void main(){
  float z = mod(iPos.z + uDist + 500., 600.) - 500.;
  vec3 wp = position*iScale + vec3(iPos.x, iPos.y, z);
  float show = iData.a > 3.5 ? inTun(z) : 1. - inTun(z);
  if (uMark.z > 0.5 && iPos.x > 8.2 && iPos.x < 8.3) show = 0.; // 도심에는 가드레일 기둥이 없다
  vP = wp; vN = normal; vUv = uv; vA = iData; vL = position;
  gl_Position = show > 0.5 ? projectionMatrix * viewMatrix * vec4(bend(wp), 1.) : vec4(2., 2., 2., 1.);
}`;
const LIT_FRAG = (surface) => /* glsl */`
varying vec3 vP, vN, vL; varying vec2 vUv; varying vec4 vA;
${surface}
void main(){
  vec3 P = vP; vec3 N = normalize(vN); if (!gl_FrontFacing) N = -N;
  vec3 V = normalize(cameraPosition - P);
  vec3 alb = vec3(.1), emis = vec3(0.); float spec = 0., gloss = 20., retro = 0., alpha = 1.;
  surface(P, V, alb, N, spec, gloss, retro, emis, alpha);
  vec3 dir; float hb = headBeam(P, dir);
  float he = hb*max(dot(N, -dir), 0.); he = he/(1. + he*0.5*(1. - max(N.y, 0.))) + min(hb*retro, 6.);
  vec3 c = alb * (envDiff(P, N) + HL_COL*he) + emis;
  #ifdef SPEC
  if (spec > 0.001) {
    vec3 s = streetSpec(P, N, V, gloss) + tailSpec(P, N, V, gloss) + oncSpec(P, N, V, gloss);
    #ifdef SPEC_TUN
    s += tunSpec(P, N, V);
    #endif
    c += spec * s;
  }
  #endif
  gl_FragColor = vec4(tone(fogMix(c, P)), alpha);
}`;
function lit(surface, o = {}) {
  return new THREE.ShaderMaterial({
    uniforms: Object.assign({}, U, o.uniforms || {}), defines: o.defines || {},
    vertexShader: COMMON + (o.vertex || LIT_VERT), fragmentShader: COMMON + LIT_FRAG(surface), side: o.side ?? THREE.DoubleSide,
  });
}

// ---------------------------------------------------------------- geometry builder
class Builder {
  constructor() { this.p = []; this.u = []; this.d = []; this.i = []; }
  vert(x, y, z, u = 0, v = 0, d0 = 0, d1 = 0) { this.p.push(x, y, z); this.u.push(u, v); this.d.push(d0, d1, 0, 0); return this.p.length / 3 - 1; }
  quad(a, b, c, d) { this.i.push(a, b, c, b, d, c); }
  rect(p00, p10, p01, p11, m, m2 = 0) { const a = this.vert(...p00, 0, 0, m, m2), b = this.vert(...p10, 1, 0, m, m2), c = this.vert(...p01, 0, 1, m, m2), d = this.vert(...p11, 1, 1, m, m2); this.quad(a, b, c, d); }
  box(x0, x1, y0, y1, z0, z1, m) {
    this.rect([x0, y0, z1], [x1, y0, z1], [x0, y1, z1], [x1, y1, z1], m); this.rect([x1, y0, z0], [x0, y0, z0], [x1, y1, z0], [x0, y1, z0], m);
    this.rect([x1, y0, z1], [x1, y0, z0], [x1, y1, z1], [x1, y1, z0], m); this.rect([x0, y0, z0], [x0, y0, z1], [x0, y1, z0], [x0, y1, z1], m);
    this.rect([x0, y1, z1], [x1, y1, z1], [x0, y1, z0], [x1, y1, z0], m); this.rect([x0, y0, z0], [x1, y0, z0], [x0, y0, z1], [x1, y0, z1], m);
  }
  ribbon(prof, zs, m) { // flat-shaded extrusion of a 2D profile along z
    let len = 0;
    for (let j = 0; j < prof.length - 1; j++) {
      const [x0, y0] = prof[j], [x1, y1] = prof[j + 1], l = Math.hypot(x1 - x0, y1 - y0); let pa = -1, pb = -1;
      for (const z of zs) { const a = this.vert(x0, y0, z, len, z, m, j), b = this.vert(x1, y1, z, len + l, z, m, j); if (pa >= 0) this.quad(pa, pb, a, b); pa = a; pb = b; }
      len += l;
    }
  }
  loft(rings, m) { // smooth-shaded skin over rings of equal point count
    const n = rings[0].length, base = this.p.length / 3;
    rings.forEach((r, k) => r.forEach((pt, j) => this.vert(pt[0], pt[1], pt[2], j / n, k, m, 0)));

  }

  S.low = ease(S.low, P.headlights >= 1 ? 1 : 0, 14, dt); S.high = ease(S.high, P.headlights === 2 ? 1 : 0, 14, dt);
  S.fogD = ease(S.fogD, P.fog, 1.2, dt); S.rainS = ease(S.rainS, P.rain, 1.5, dt);
  if (S.fogGlass > 0) { const rate = P.defrost ? (P.ac && P.freshAir ? 1 / 10 : (P.ac || P.freshAir) ? 1 / 18 : 1 / 30) : (P.ac && P.freshAir ? 1 / 60 : 0);
    S.fogGlass = Math.max(0, S.fogGlass - rate * dt); if (S.fogGlass === 0) emit('fogCleared'); }
  if (P.wiper > 0) S.wRun = true;
  S.wAp = S.wA; S.wBp = S.wB;
  if (S.wRun) { S.wPhase += dt / (P.wiper === 2 ? 0.72 : 1.3); if (S.wPhase >= 1) { if (P.wiper > 0) S.wPhase -= 1; else { S.wPhase = 0; S.wRun = false; } } }
  const sw = 0.5 - 0.5 * Math.cos(S.wPhase * Math.PI * 2);
  S.wA = lerp(WREST[0], WUP[0], sw); S.wB = lerp(WREST[1], WUP[1], sw);

  // tunnel
  const entL = S.entW === null ? -1e5 : S.entW + S.dist, exitL = S.exitW === null ? -1e5 - 1 : S.exitW + S.dist;
  const inside = entL > 0 && exitL < 0;
  if (inside !== S.inTunnel) { S.inTunnel = inside; emit(inside ? 'tunnelEnter' : 'tunnelExit'); }
  if (S.exitW !== null && exitL > 80) { S.entW = S.exitW = null; }
  S.entL = entL; S.exitL = exitL;

  // oncoming high-beam car
  if (S.glareZ !== null) { S.glareZ += (S.v + 25) * dt; if (S.glareZ > 6) { S.glareZ = null; emit('glareEnd'); } }
  const tv = P.speed / 3.6; S.far1 += (S.v - tv - 0.6) * dt; S.far2 += (S.v - tv + 0.4) * dt;

  // rain streak scroll
  const sp = Math.max(S.v, 0);
  S.rainOff[0] = (S.rainOff[0] + 0.8 * dt / 18) % 1; S.rainOff[1] = (S.rainOff[1] - 9 * dt / 9 % 1 + 1) % 1; S.rainOff[2] = (S.rainOff[2] + sp * dt / 26) % 1;

}
function wetStep(dt) {

  u.tPrev.value = wetA.texture; u.uRate.value = S.inTunnel ? 0 : S.rainS * dt / 1.1; u.uDry.value = dt * (S.rainS < 0.02 || S.inTunnel ? 0.2 : 0);
  u.uSeed.value.set((S.time * 13.37) % 1, (S.time * 7.77) % 1); u.uReset.value = S.wetReset ? 1 : 0; S.wetReset = false;
  const moving = S.wRun;
  WU.uWipA.value.set(WPIV[0][0] * WU.uAsp.value / (16 / 9), WPIV[0][1], moving ? S.wAp : -9, moving ? S.wA : -9);
  WU.uWipB.value.set(WPIV[1][0] * WU.uAsp.value / (16 / 9), WPIV[1][1], moving ? S.wBp : -9, moving ? S.wB : -9);
  quad.material = wetMat; renderer.setRenderTarget(wetB); renderer.render(quadScene, quadCam);
  [wetA, wetB] = [wetB, wetA];
}

// ---------------------------------------------------------------- per-frame uniform sync and draw
const tmpV = new THREE.Vector3();
function render() {
  const t = S.time, v = S.v;
  const curve = P.curve * 1.0;
  const cx = curve * (Math.sin(S.dist / 420) * 0.00042 + Math.sin(S.dist / 173 + 1) * 0.00012), cy = curve * (Math.sin(S.dist / 260 + 2) * 0.00009) - 0.00042 * S.gradeS;
  U.uCurve.value.set(cx, cy); U.uDist.value = S.dist % 2400; U.uTime.value = t % 1000; U.uOpp.value = S.opp % 600; U.uSpeed.value = v;
  U.uTun.value.set(clamp(S.entL, -1e5, 1e5), clamp(S.exitL, -1e5 - 1, 1e5));
  const tunVis = S.entL > -720 && S.exitL < 20; tube.visible = tunVis; portal.visible = tunVis && S.entL < 14; portal.position.z = S.entL;
  U.uOppOn.value = ease(U.uOppOn.value, S.entW === null ? 1 : 0, 2, 0.016);
  const carX = S.x + S.laneX;
  U.uCar.value.set(carX, S.yaw, 0);
  const blink = (t * 1.42) % 1 < 0.5 ? 1 : 0;
  U.uLamp.value.set(S.low * (1 - 0.25 * S.high), S.high, (P.turn === 'left' || P.turn === 'hazard') ? blink : 0, (P.turn === 'right' || P.turn === 'hazard') ? blink : 0);
  const dens = 0.0005 + S.fogD * S.fogD * 0.07 + S.rainS * 0.0035;
  const fb = 0.011 + S.fogD * 0.028 + S.rainS * 0.006;
  { // 안개·먼 풍경의 색도 시간대를 따른다
    const d = S.day, k = d < 0.4 ? d / 0.4 : (d - 0.4) / 0.6, gray = 1 - 0.3 * S.rainS;
    const a = d < 0.4 ? [fb, fb * 1.18, fb * 1.5] : [0.30, 0.19, 0.17], b = d < 0.4 ? [0.30, 0.19, 0.17] : [0.42 * gray, 0.50 * gray, 0.62 * gray];
    U.uFog.value.set(lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k), dens);
  }
  U.uDay.value = S.day;
  const haze = S.fogD * S.fogD * 1.0 + S.rainS * 0.05 + 0.004;
  U.uFogGlow.value.set(S.low * haze * 0.55, S.high * haze * 1.5);
  U.uEnv.value.set(clamp(S.rainS * 2.2, 0, 1), 1, 0.85, Math.max(P.hydroplane, S.rainS > 0.85 ? 0.4 : 0));
  const showLead = P.lead && S.gap < 380;
  const leadZ = -(FRONT + S.gap);
  car.visible = showLead; car.position.set(S.leadX, 0, leadZ - 2.3);
  U.uLead.value.set(S.leadX, showLead ? leadZ : -5000, showLead ? 1 : 0, showLead ? S.leadBrakeVis : 0);
  const lblink = (t * 1.42) % 1 < 0.5 ? 1 : 0; U.uLeadInd.value.set(S.leadInd < 0 ? lblink : 0, S.leadInd > 0 ? lblink : 0);

  // camera
  const vib = v > 1 ? 1 : 0, sh = S.shake;
  camera.position.set(carX + EYE_X, EYE_Y + vib * (Math.sin(t * 31) * 0.0012 + Math.sin(t * 17.3) * 0.0016) + sh * Math.sin(t * 63) * 0.03, 0);
  camera.rotation.set(S.pitch + 0.012 - 0.03 * S.gradeS + sh * Math.sin(t * 47) * 0.02, -S.yaw, S.roll + sh * Math.sin(t * 55) * 0.012);
  camera.updateMatrixWorld();

  // landmarks
  const lmOn = S.lmW !== null;
  U.uMark.value.set(S.lmZ, lmOn ? ({ crosswalk: 1, tollgate: 2, school: 3, roundabout: 4, tollbooth: 2 })[S.lmKind] : 0, S.placeId);
  signalMast.visible = lmOn && S.lmKind === 'crosswalk' && S.placeId === 1; signalMast.position.set(0, 0, S.lmZ);
  schoolSigns.visible = lmOn && S.lmKind === 'school'; schoolSigns.position.set(0, 0, S.lmZ);
  const rbOn = lmOn && S.lmKind === 'roundabout';
  // 앱이 도는 차의 시각을 줄 때는, 진입 지점을 지나간 차가 맞은편 출구로 빠져나가 다시 돌아오지 않는다(지나간 뒤 비어 보이게)
  const ringCarOn = (a) => P.ringT === null || a < 2.3;
  island.visible = rbOn; island.position.set(0, 0, S.lmZ - 19);
  { // 주차된 차와 도는 차: 자리와 바닥 그림자
    let n = 0; const sh = U.uCarSh.value;
    PARKED.forEach((c) => { const z = ((c.userData.z + S.dist + 500) % 600 + 600) % 600 - 500;
      const on = S.placeId === 1 && !(lmOn && Math.abs(z - (S.lmZ - (S.lmKind === 'roundabout' ? 19 : 8))) < (S.lmKind === 'roundabout' ? 32 : 26));
      c.visible = on && z < 20; c.position.set(c.userData.x, 0, z); if (c.visible && n < 6) sh[n++].set(c.userData.x, z, 1); });
    ringCars.forEach((c, i) => { const a = S.rbA + i * 2.6; if (rbOn && ringCarOn(a) && n < 8) { sh[n++].set(Math.sin(a) * 12.6, S.lmZ - 19 + Math.cos(a) * 12.6, 1); } });
    for (; n < 8; n++) sh[n].z = 0;
  }
  ringCars.forEach((c, i) => { const a = S.rbA + i * 2.6; c.visible = rbOn && ringCarOn(a); c.position.set(Math.sin(a) * 12.6, 0, S.lmZ - 19 + Math.cos(a) * 12.6); c.rotation.y = a - Math.PI / 2; });
  peds.visible = lmOn && (S.lmKind === 'crosswalk' || S.lmKind === 'school') && S.pedX > -5.25; peds.position.set(S.pedX, Math.abs(Math.cos(UP.uWalk.value)) * 0.022, S.lmZ);
  toll.visible = lmOn && (S.lmKind === 'tollgate' || S.lmKind === 'tollbooth'); toll.position.set(0, 0, S.lmZ);
  boothArm.visible = toll.visible; boothArm.position.set(2.24, 1.03, S.lmZ - 3.4); boothArm.rotation.z = S.armA * 1.45;

  // dynamic sprites
  const B = S.leadBrakeVis, L = showLead ? 1 : 0;
  for (let i = 0; i < 2; i++) dyn.put(i, S.leadX + (i ? 0.69 : -0.69), 0.875, leadZ + 0.06, 0.34 + 0.5 * B, 3, L * (0.9 + 7 * B), 1, 0.07, 0.035);
  dyn.put(2, S.leadX, 1.627, leadZ - 0.3, 0.42, 3, L * B * 3, 1, 0.07, 0.035);
  dyn.put(3, S.leadX + (S.leadInd < 0 ? -0.56 : 0.56), 0.835, leadZ + 0.06, 0.4, 3, L * (S.leadInd ? lblink : 0) * 4, 1, 0.5, 0.05);
  let gI = 0;
  if (S.glareZ !== null) { const d = -S.glareZ; gI = clamp(1.5 * (1 - d / 430), 0, 1.3); gI *= gI; }
  for (let i = 0; i < 2; i++) dyn.put(4 + i, -8.3 + (i ? 0.68 : -0.68), 0.86, S.glareZ ?? -5000, 0.42, 3, S.glareZ !== null ? 5 + 9 * gI : 0, 1, 0.96, 0.88);
  U.uOnc.value.set(-8.3, 0.86, S.glareZ ?? -5000, gI);
  [[S.far1, -3.6], [S.far2, 3.6]].forEach(([z, x], k) => { const f = clamp((z + 470) / 120, 0, 1) * (S.entW === null ? 1 : 0); for (let i = 0; i < 2; i++) dyn.put(6 + k * 2 + i, x + (i ? 0.68 : -0.68), 0.88, z, 0.3, 3, 0.8 * f, 1, 0.07, 0.035); });
  dyn.flush();
  if (S.glareZ !== null && S.glareZ < -1) { const z = S.glareZ; tmpV.set(-8.3 + cx * z * z, 0.86 + cy * z * z, z).project(camera); const on = tmpV.z < 1 ? clamp((1.25 - Math.abs(tmpV.x)) * 4, 0, 1) : 0; CU.uGlare.value.set(tmpV.x * 0.5 + 0.5, tmpV.y * 0.5 + 0.5, gI * 1.4 * on); } else CU.uGlare.value.z = 0;

  // rain
  rain.geometry.instanceCount = S.inTunnel && S.entL > 30 ? 0 : Math.floor(clamp(S.rainS, 0, 1) * (P.quality ? RAIN_MAX : 350));
  U.uRainOff.value.set(S.rainOff[0], S.rainOff[1], S.rainOff[2]);
  rain.visible = rain.geometry.instanceCount > 0;

  renderer.info.reset();
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  CU.tScene.value = rt.texture; CU.tWet.value = wetA.texture; CU.uFilm.value = clamp(S.rainS * 1.25, 0, 1); CU.uFogG.value = S.fogGlass; CU.uWipVis.value = S.wRun ? 1 : 0;
  CU.uBloom.value = P.bloom ? 1 - 0.85 * S.day : 0; // 낮에는 번짐을 줄인다(하늘이 하얗게 날아가지 않게)
  CU.uDim.value = Math.max(S.crashed || P.crash ? 0.25 : 0, S.cutT < 0 ? 0 : S.cutT < 0.3 ? S.cutT / 0.3 : (0.6 - S.cutT) / 0.3); CU.uBlur.value = P.blur;
  quad.material = compMat; renderer.setRenderTarget(null); renderer.render(quadScene, quadCam);
}

// ---------------------------------------------------------------- loop, overlay, keyboard
const fpsEl = document.getElementById('fps'), helpEl = document.getElementById('help');
const BRIDGE = window.SideSeatBridge;
let last = performance.now(), acc = 0, frames = 0, fpsNow = 0, msNow = 0, cpuAcc = 0, perfN = 0, slowN = 0;
function frame(now) {
  // 상한이 있으면 다음 프레임 요청을 늦춘다. WebView는 프레임 요청이 걸려 있는 동안 화면 주사율로 창을 다시 그리므로,
  // 요청을 받고 건너뛰는 것으로는 부하가 줄지 않는다(에뮬레이터 실측 11-14)
  if (P.fpsCap > 0) {
    const period = 1000 / P.fpsCap;
    if (now - last < period - 4) { requestAnimationFrame(frame); return; } // 너무 일찍 왔으면 다음 프레임에 그린다
    setTimeout(() => requestAnimationFrame(frame), period - 10);
  } else requestAnimationFrame(frame);
  if (BRIDGE && BRIDGE.onFrame) BRIDGE.onFrame(); // 앱의 운전석 층이 이 프레임에 맞춰 같이 그린다
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  const t0 = performance.now();
  if (!P.paused) update(dt);
  render();
  cpuAcc += performance.now() - t0; acc += dt; frames++;
  if (acc >= 0.5) { fpsNow = frames / acc; msNow = cpuAcc / frames; acc = 0; frames = 0; cpuAcc = 0;
    if (++perfN % 4 === 0) emit('perf', { fps: +fpsNow.toFixed(1), ms: +msNow.toFixed(2), q: P.quality, calls: renderer.info.render.calls, w: rt.width, h: rt.height });
    // 프레임이 두 번 연달아 모자라면 품질을 낮춘다(한번 낮추면 그대로 둔다)
    if (P.quality && S.time > 3) { slowN = fpsNow < (P.fpsCap > 0 ? Math.min(40, P.fpsCap * 0.8) : 40) ? slowN + 1 : 0; if (slowN >= 4) { set({ quality: 0 }); emit('quality', { q: 0, fps: +fpsNow.toFixed(1) }); } }
    if (!fpsEl.classList.contains('hidden')) fpsEl.textContent = `${fpsNow.toFixed(0)} fps  cpu ${msNow.toFixed(2)} ms\ncalls ${renderer.info.render.calls}  tris ${renderer.info.render.triangles}\n${rt.width}x${rt.height} q${P.quality}\n${(S.v * 3.6).toFixed(0)} km/h  gap ${S.gap.toFixed(1)} m`; }
}
helpEl.textContent = [
  'TABI scene3d                H: hide help   F: fps',
  '↑/↓ target speed ±10      Space  brake (hold)',
  '←/→ steer (hold)           Q/E/Z  turn left/right/hazard',
  'R rain  W wiper  L headlights  K dense fog',
  'V fog up windshield   D defrost  A a/c  S fresh air',
  'B lead brake   G oncoming glare   T tunnel   Y hydroplane',
  'P quality 0/1   M bloom',
  '1 cruise 2 rain 3 fogged 4 suddenStop 5 tunnel',
  '6 denseFog 7 glare 8 merge 9 hydroplane',
].join('\n');
if (Q.get('help') === '0' || window.SideSeatBridge) helpEl.classList.add('hidden');
if (Q.get('fps') === '1') fpsEl.classList.remove('hidden');
const held = {};
const names = Object.keys(SCENARIOS);
window.addEventListener('keydown', (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; if (e.repeat && k !== 'ArrowUp' && k !== 'ArrowDown') return; held[k] = true;
  if (k >= '1' && k <= '9') return void scenario(names[+k - 1]);
  const tog = (key) => set({ [key]: !P[key] });
  switch (k) {
    case 'h': helpEl.classList.toggle('hidden'); break; case 'f': fpsEl.classList.toggle('hidden'); break;
    case 'ArrowUp': set({ speed: P.speed + 10 }); break; case 'ArrowDown': set({ speed: P.speed - 10 }); break;
    case ' ': set({ brake: 1 }); e.preventDefault(); break;
    case 'ArrowLeft': set({ steer: -45 }); break; case 'ArrowRight': set({ steer: 45 }); break;
    case 'q': set({ turn: P.turn === 'left' ? 'off' : 'left' }); break; case 'e': set({ turn: P.turn === 'right' ? 'off' : 'right' }); break; case 'z': set({ turn: P.turn === 'hazard' ? 'off' : 'hazard' }); break;
    case 'r': set({ rain: [0, 0.35, 0.7, 1][([0, 0.35, 0.7, 1].indexOf(P.rain) + 1) % 4] }); break;
    case 'w': set({ wiper: (P.wiper + 1) % 3 }); break; case 'l': set({ headlights: (P.headlights + 1) % 3 }); break;
    case 'k': set({ fog: [0, 0.5, 0.85][([0, 0.5, 0.85].indexOf(P.fog) + 1) % 3] }); break;
    case 'v': set({ fogging: S.fogGlass > 0.5 ? 0 : 1 }); break;
    case 'd': tog('defrost'); break; case 'a': tog('ac'); break; case 's': tog('freshAir'); break;
    case 'b': tog('leadBrake'); break; case 'g': set({ glare: true }); break; case 't': tog('tunnel'); break;
    case 'y': set({ hydroplane: P.hydroplane ? 0 : 1 }); break;
    case 'p': set({ quality: P.quality ? 0 : 1 }); break; case 'm': tog('bloom'); break;
  }
});
window.addEventListener('keyup', (e) => { const k = e.key; if (k === ' ') set({ brake: 0 }); if (k === 'ArrowLeft' || k === 'ArrowRight') set({ steer: 0 }); });

const sim = window.sim = {
  set, scenario, onEvent: null, scenarios: names,
  get: () => ({ params: Object.assign({}, P), speedNow: +(S.v * 3.6).toFixed(1), leadSpeedNow: +(S.lv * 3.6).toFixed(1), gap: +S.gap.toFixed(2), lateral: +S.x.toFixed(2), fogging: +S.fogGlass.toFixed(3), inTunnel: S.inTunnel, crashed: S.crashed, time: +S.time.toFixed(2),
    place: P.place, day: +S.day.toFixed(2), landmarkZ: +S.lmZ.toFixed(1), pedX: +S.pedX.toFixed(2), laneX: +S.laneX.toFixed(2),
    fps: +fpsNow.toFixed(1), cpuMs: +msNow.toFixed(2), calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, target: [rt.width, rt.height] }),
  step(seconds, dt = 1 / 60) { for (let t = 0; t < seconds - 1e-9; t += dt) update(dt); render(); },
  snapshot(type = 'image/png', q) { render(); return canvas.toDataURL(type, q); },
};
if (Q.get('scenario')) scenario(Q.get('scenario'));
requestAnimationFrame(frame);
emit('ready');
</script>
